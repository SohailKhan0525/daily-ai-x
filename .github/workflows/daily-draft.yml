name: AI X Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - post_history.json
      - slot_state.json
  # 09:00 through 21:00 IST, every 15 minutes.
  # Expressed in UTC for maximum scheduler compatibility.
  # 09:00 IST = 03:30 UTC; 21:00 IST = 15:30 UTC.
  schedule:
    - cron: '30,45 3 * * *'
    - cron: '*/15 4-14 * * *'
    - cron: '0,15,30,45 15 * * *'

concurrency:
  group: ai-x-publisher
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify publishing slot
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          hour="$(date +%H)"
          minute="$(date +%M)"
          today="$(date +%Y-%m-%d)"
          slot_minute=$((10#$minute / 15 * 15))
          slot=$(printf '%s-%02d-%02d' "$today" "$hour" "$slot_minute")

          if (( 10#$hour < 9 || 10#$hour > 21 || (10#$hour == 21 && 10#$minute > 0) )); then
            echo "Outside 09:00-21:00 IST publishing window: $(date)"
            exit 0
          fi

          echo "PUBLISH_SLOT=$slot" >> "$GITHUB_ENV"
          echo "Scheduled slot: $slot (current local time: $(date))"

      - name: Skip already-published slot
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          if [[ -f slot_state.json ]]; then
            published_slot="$(python - <<'PY'
          import json
          try:
              with open('slot_state.json', encoding='utf-8') as f:
                  print(json.load(f).get('last_slot', ''))
          except Exception:
              print('')
          PY
          )"
            echo "Last published slot: $published_slot"
            if [[ "$published_slot" == "$PUBLISH_SLOT" ]]; then
              echo "This slot already published successfully. Exiting without another post."
              exit 0
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate code on non-scheduled runs
        if: github.event_name != 'schedule'
        run: python -m py_compile publisher_v3.py

      - name: Run publisher
        if: github.event_name == 'schedule'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          POST_TO_X: 'true'
        shell: bash
        run: |
          echo "Trigger: schedule"
          echo "MODE: LIVE scheduled publish"
          echo "POST_TO_X=$POST_TO_X"
          echo "PUBLISH_SLOT=$PUBLISH_SLOT"
          echo "Gemini primary configured: $([[ -n "$GEMINI_API_KEY" ]] && echo yes || echo no)"
          echo "Gemini backup configured: $([[ -n "$GEMINI_API_KEY_BACKUP" ]] && echo yes || echo no)"

          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "ERROR: GEMINI_API_KEY is missing"
            exit 1
          fi
          if [[ -z "$GEMINI_API_KEY_BACKUP" ]]; then
            echo "WARNING: GEMINI_API_KEY_BACKUP is missing; the run has only one Gemini key."
          fi

          success=0
          for attempt in 1 2 3; do
            echo "Publisher attempt $attempt/3"
            if python publisher_v3.py; then
              success=1
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Publisher failed; retrying after backoff..."
              sleep $((30 * attempt))
            fi
          done

          if [[ "$success" -ne 1 ]]; then
            echo "ERROR: publisher failed after 3 attempts"
            exit 1
          fi

      - name: Mark slot published
        if: success() && github.event_name == 'schedule'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          slot = os.environ['PUBLISH_SLOT']
          with open('slot_state.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'last_slot': slot,
                  'published_at': datetime.now().astimezone().isoformat(),
              }, f, indent=2)
              f.write('\n')
          PY

      - name: Persist state
        if: success() && github.event_name == 'schedule'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_history.json slot_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist X publisher state"
            git push
          else
            echo "No state changes to commit."
          fi

      - name: Schedule confirmation
        if: always()
        run: |
          echo "Publishing window: 09:00-21:00 IST"
          echo "Cadence: every 15 minutes"
          echo "Live scheduled slots: 09:00-21:00 IST"
          echo "Cron is expressed in UTC for compatibility"
          echo "Scheduled runs are LIVE; push/manual runs only validate code."
          echo "POST_TO_X is forced true only for scheduled runs."
          echo "Gemini primary + optional backup key are supported."
