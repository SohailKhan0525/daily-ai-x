name: AI X Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - post_history.json
  schedule:
    # GitHub cron is UTC: 08:00 IST = 02:30 UTC; 16:00 IST = 10:30 UTC.
    - cron: '30 2 * * *'
    - cron: '30 10 * * *'

concurrency:
  group: ai-x-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          POST_TO_X: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        shell: bash
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Local time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          if [[ "$POST_TO_X" == "true" ]]; then
            echo "MODE: LIVE scheduled publish"
          else
            echo "MODE: DRY RUN (no X post)"
          fi

          success=0
          for attempt in 1 2 3; do
            echo "Publisher attempt $attempt/3"
            if python publisher_v2.py; then
              success=1
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Publisher failed; retrying after backoff..."
              sleep $((30 * attempt))
            fi
          done

          if [[ "$success" -ne 1 ]]; then
            echo "ERROR: publisher failed after 3 attempts"
            exit 1
          fi

      - name: Persist post history
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          if [[ -f post_history.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add post_history.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist X post history"
              git push
            else
              echo "No post history changes to commit."
            fi
          fi

      - name: Schedule confirmation
        if: always()
        run: |
          echo "Daily publishing windows: 08:00 IST and 16:00 IST"
          echo "Scheduled runs are the only live-post mode."
