name: AI X Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - post_history.json
      - slot_state.json
  schedule:
    - cron: '0-55/5 8 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '0-55/5 16 * * *'
      timezone: 'Asia/Kolkata'

concurrency:
  group: ai-x-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify publishing slot
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          hour="$(date +%H)"
          today="$(date +%Y-%m-%d)"

          if [[ "$hour" == "08" ]]; then
            slot="${today}-08"
          elif [[ "$hour" == "16" ]]; then
            slot="${today}-16"
          else
            echo "Outside publishing windows: $(date)"
            exit 0
          fi

          echo "PUBLISH_SLOT=$slot" >> "$GITHUB_ENV"
          echo "Scheduled slot: $slot (current local time: $(date))"

      - name: Skip already-published slot
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          if [[ -f slot_state.json ]]; then
            published_slot="$(python - <<'PY'
          import json
          try:
              with open('slot_state.json', encoding='utf-8') as f:
                  print(json.load(f).get('last_slot', ''))
          except Exception:
              print('')
          PY
          )"
            echo "Last published slot: $published_slot"
            if [[ "$published_slot" == "$PUBLISH_SLOT" ]]; then
              echo "This slot already published successfully. Exiting without another post."
              exit 0
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        shell: bash
        run: |
          # Set this explicitly in the shell. Scheduled runs are LIVE;
          # push/manual runs are DRY RUN. This avoids relying on expression
          # coercion when passing the value into Python.
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            export POST_TO_X=true
            echo "Trigger: schedule"
            echo "MODE: LIVE scheduled publish"
            echo "POST_TO_X=$POST_TO_X"
          else
            export POST_TO_X=false
            echo "Trigger: ${{ github.event_name }}"
            echo "MODE: DRY RUN (no X post)"
            echo "POST_TO_X=$POST_TO_X"
          fi

          success=0
          for attempt in 1 2 3; do
            echo "Publisher attempt $attempt/3"
            if python publisher_v2.py; then
              success=1
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Publisher failed; retrying after backoff..."
              sleep $((30 * attempt))
            fi
          done

          if [[ "$success" -ne 1 ]]; then
            echo "ERROR: publisher failed after 3 attempts"
            exit 1
          fi

      - name: Mark slot published
        if: success() && github.event_name == 'schedule'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          slot = os.environ['PUBLISH_SLOT']
          with open('slot_state.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'last_slot': slot,
                  'published_at': datetime.now().astimezone().isoformat(),
              }, f, indent=2)
              f.write('\n')
          PY

      - name: Persist state
        if: success() && github.event_name == 'schedule'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_history.json slot_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist X publisher state"
            git push
          else
            echo "No state changes to commit."
          fi

      - name: Schedule confirmation
        if: always()
        run: |
          echo "Publishing windows: 08:00-08:55 IST and 16:00-16:55 IST"
          echo "Only scheduled runs can publish to X."
