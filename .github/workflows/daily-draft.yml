name: AI X Publisher

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC: 08:00 IST = 02:30 UTC; 16:00 IST = 10:30 UTC.
    - cron: '30 2 * * *'
    - cron: '30 10 * * *'

concurrency:
  group: ai-x-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Kolkata
      POST_TO_X: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and publish (scheduled only)
        if: github.event_name == 'schedule'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        shell: bash
        run: |
          echo "Scheduled publish: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          success=0
          for attempt in 1 2 3; do
            echo "Publisher attempt $attempt/3"
            if python publisher_v2.py; then
              success=1
              break
            fi
            echo "Publisher failed; retrying after backoff..."
            sleep $((20 * attempt))
          done
          if [[ "$success" -ne 1 ]]; then
            echo "ERROR: publisher failed after 3 attempts"
            exit 1
          fi

      - name: Manual run safety
        if: github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          echo "Manual run is DRY-RUN only; no X post will be published."
          POST_TO_X=false python publisher_v2.py

      - name: Persist post history
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          if [[ -f post_history.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add post_history.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist X post history"
              git push
            else
              echo "No post history changes to commit."
            fi
          fi

      - name: Schedule confirmation
        if: always()
        run: echo "Daily publishing windows: 08:00 IST and 16:00 IST"
